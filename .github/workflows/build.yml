name: Build Android APK

on:
  push:
    branches: [ "main", "master", "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JAVA_OPTS: "-Djava.awt.headless=true"
      _JAVA_OPTIONS: "-Djava.awt.headless=true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -Djava.awt.headless=true \
            -Dorg.gradle.jvmargs="-Xmx4096m -Djava.awt.headless=true" \
            -Pksp.incremental=false \
            -Pksp.run.in.process=false

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartCreator-APK
          path: "**/build/outputs/apk/debug/*.apk"
