name: Build Smart Creator APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Project & Capacitor
        run: |
          mkdir -p www
          # نسخ ملفات المشروع لبيئة الويب
          cp -r index.html www/ 2>/dev/null || true
          cp -r *.js www/ 2>/dev/null || true
          cp -r *.css www/ 2>/dev/null || true
          cp -r assets www/ 2>/dev/null || true
          cp -r img www/ 2>/dev/null || true
          
          # إعداد Capacitor بنسخة مستقرة
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Smart Creator" "com.smartcreator.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCreator-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
