name: Build Android APK

on:
  push:
    branches: [ "main", "master", "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses & Setup Keystore
        run: |
          yes | sdkmanager --licenses || true
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Djava.awt.headless=true" >> gradle.properties
          echo "ksp.incremental=false" >> gradle.properties
          echo "ksp.run.in.process=false" >> gradle.properties
          echo "android.builder.sdkDownload=true" >> gradle.properties
          
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartCreator-APK
          path: "**/build/outputs/apk/debug/*.apk"
